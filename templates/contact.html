
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Contact</title>
		<style>
			body{font-family: Arial, sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#222}
			form{display:flex;flex-direction:column;gap:10px}
			label{font-weight:600}
			input,textarea{padding:8px;border:1px solid #ccc;border-radius:4px}
			button{padding:10px 14px;background:#0078d4;color:#fff;border:none;border-radius:4px;cursor:pointer}
		</style>
	</head>
	<body>
		<h1>Contact Us</h1>
		<p>Please fill out the form below and we'll get back to you.</p>
		<form action="/contact" method="post">
			<div>
				<label for="name">Name</label>
				<input id="name" name="name" type="text" required>
			</div>
			<div>
				<label for="email">Email</label>
				<input id="email" name="email" type="email" required>
			</div>
			<div>
				<label for="message">Message</label>
				<textarea id="message" name="message" rows="6" required></textarea>
			</div>
			<button type="submit">Send</button>
		</form>
	</body>
</html>
